    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Padel Pals</title>
    <meta name="description" content="Arcade 3D padel: 1v1 or 2v2 against bots or friends online, with glass-wall rebounds and touch, mouse and keyboard controls." />
    <meta property="og:title" content="Padel Pals" />
    <meta property="og:description" content="Arcade 3D padel: 1v1 or 2v2 against bots or friends online, with glass-wall rebounds and touch, mouse and keyboard controls." />

    <meta name="twitter:card" content="summary_large_image" />

    <style>
      body {
        font-family: 'Fredoka', cursive, system-ui, sans-serif;
      }
      .font-brand {
        font-family: 'Lilita One', cursive, sans-serif;
      }
      @keyframes gentleBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .animate-logo-bounce {
        animation: gentleBounce 2.4s ease-in-out infinite;
      }
      @keyframes popWobble {
        0% { transform: scale(1) rotate(-1deg); }
        50% { transform: scale(1.03) rotate(1deg); }
        100% { transform: scale(1.02) rotate(-0.5deg); }
      }
      .btn-chunky:hover {
        animation: popWobble 0.22s ease-in-out forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
